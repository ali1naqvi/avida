INSTSET instset:hw_type=0

# No-ops
INST nop-B         # c
INST nop-C         # c


# --- Conditionals (link sensing to motor response) ---
# Flow control operations
INST if-n-equ      # d
INST if-less       # e
# INST if->=-0
# INST if-<=-0
INST if-not-0
INST if-les-0
INST if-grt-0


INST if-label      # f
# INST mov-head      # g
# INST jmp-head      # h
# INST get-head      # i
# INST set-flow      # j

# Single Argument Math
INST zero
# INST shift-r       # k
# INST shift-l       # l
INST inc           # m
INST dec           # n
INST push          # o
INST pop           # p
INST swap-stk      # q
INST swap          # r

# Double Argument Math
INST add           # s
INST sub           # t
INST nand          # u

# # Biological Operations
# INST h-copy        # v
# INST h-alloc       # w

# I/O and Sensory
# INST IO            # y
# INST h-search      # z

# Reproduction
# INST repro
# INST repro-semel
INST stop

# --- Movement primitives (E. coli motor analogs) ---
INST move                    # "run": move one cell forward
INST rotate-left-one         # "tumble": reorient 45 deg left
INST rotate-right-one        # "tumble": reorient 45 deg right

# --- Sensing primitives (E. coli chemoreceptor analogs) ---
INST sense-resource0         # sense resource level at current cell -> BX
INST sense-faced-resource0   # sense resource level in faced cell -> BX
