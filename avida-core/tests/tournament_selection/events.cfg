# Founders start away from the food peak (>= 20 env-cells), same rule as offspring
# (OFFSPRING_WORLD_POS 2 + OFFSPRING_WORLD_POS_MARGIN 20). Args: fname count min_distance resource merit
g begin InjectAwayFromGradientPeak blank_stop.org 500 25 food0 1.0

# FOR 50 x 50 WORLD
#g 50:50:end SetGradientResource GRADIENT_RESOURCE food0:height=80:spread=60:plateau=-1:decay=1:move_a_scaler=1:peakx=25:peaky=25:max_x=30:min_x=20:max_y=30:min_y=20:plateau_inflow=0.0


# Localized, stationary peak at the world center (25,25): min_x=max_x=min_y=max_y=25
# makes "away from the peak" well-defined (the whole-world max_x=48:min_x=1 box made
# every cell <20 from the peak region, so births fell back onto the parent's cell).
# spread=35 keeps a sensable gradient that reaches the >=20-cell birth ring so newborns
# can climb toward the peak. Reduce spread for a tighter peak (keep spread >= the birth margin).
u begin SetGradientResource GRADIENT_RESOURCE food0:height=80:spread=35:plateau=-1:decay=1:move_a_scaler=1:peakx=25:peaky=25:max_x=25:min_x=25:max_y=25:min_y=25:plateau_inflow=0.0

